<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title desc"><title id="title">配列の要素と合計の更新</title><desc id="desc">foreachは要素を一つずつ受け取り、totalへ加算します。配列の長さ3と、最後の要素番号2を区別します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c6b82"/></marker></defs><style>text{font-family:system-ui,-apple-system,'Segoe UI','Noto Sans CJK JP',sans-serif;fill:#243248}.small{font-size:14px;fill:#53627a}.label{font-size:17px;font-weight:700}.tag{font-size:12px;font-weight:700;fill:#4f46e5}.mono{font-family:ui-monospace,Consolas,monospace}</style><rect width="760" height="350" rx="14" fill="#f8fafc"/><text x="380" y="32" text-anchor="middle" class="label">配列の添字は 0 から始まる</text><rect x="42" y="67" width="195" height="79" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="139.5" y="99.0" text-anchor="middle" class="label">120 分</text><text x="139.5" y="129.0" text-anchor="middle" class="small">index 0</text><path d="M140 146V210" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><rect x="42" y="214" width="195" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="139.5" y="239.5" text-anchor="middle" class="label">total = 120</text><text x="139.5" y="269.5" text-anchor="middle" class="small">0 + 120</text><path d="M237 247H276" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><rect x="282" y="67" width="195" height="79" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="379.5" y="99.0" text-anchor="middle" class="label">90 分</text><text x="379.5" y="129.0" text-anchor="middle" class="small">index 1</text><path d="M380 146V210" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><rect x="282" y="214" width="195" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="379.5" y="239.5" text-anchor="middle" class="label">total = 210</text><text x="379.5" y="269.5" text-anchor="middle" class="small">120 + 90</text><path d="M477 247H516" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><rect x="522" y="67" width="195" height="79" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="619.5" y="99.0" text-anchor="middle" class="label">150 分</text><text x="619.5" y="129.0" text-anchor="middle" class="small">index 2</text><path d="M620 146V210" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><rect x="522" y="214" width="195" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.5" y="239.5" text-anchor="middle" class="label">total = 360</text><text x="619.5" y="269.5" text-anchor="middle" class="small">210 + 150</text><text x="380" y="322" text-anchor="middle" class="small">合計は 0 → 120 → 210 → 360 の順に更新される</text></svg>
