<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title desc"><title id="title">等値性と参照の同一性</title><desc id="desc">この図はrecord classを別々にnewした例です。record structは値型であり、参照の同一性を同じように捉えません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c6b82"/></marker></defs><style>text{font-family:system-ui,-apple-system,'Segoe UI','Noto Sans CJK JP',sans-serif;fill:#243248}.small{font-size:14px;fill:#53627a}.label{font-size:17px;font-weight:700}.tag{font-size:12px;font-weight:700;fill:#4f46e5}.mono{font-family:ui-monospace,Consolas,monospace}</style><rect width="760" height="350" rx="14" fill="#f8fafc"/><rect x="32" y="36" width="316" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="190.0" y="84.5" text-anchor="middle" class="label">record A</text><text x="190.0" y="114.5" text-anchor="middle" class="small">Id=1 / Name=ノート</text><rect x="412" y="36" width="316" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="570.0" y="84.5" text-anchor="middle" class="label">record B</text><text x="570.0" y="114.5" text-anchor="middle" class="small">Id=1 / Name=ノート</text><rect x="32" y="183" width="316" height="112" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="190.0" y="231.5" text-anchor="middle" class="label">A == B</text><text x="190.0" y="261.5" text-anchor="middle" class="small">値が同じ → True</text><rect x="412" y="183" width="316" height="112" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="570.0" y="231.5" text-anchor="middle" class="label">ReferenceEquals</text><text x="570.0" y="261.5" text-anchor="middle" class="small">別の実体 → False</text></svg>
