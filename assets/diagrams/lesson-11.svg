<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title desc"><title id="title">共通の型から異なる処理を呼ぶ</title><desc id="desc">継承関係とvirtual / overrideによって、同じSend呼び出しから実体ごとに異なる処理を実行します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c6b82"/></marker></defs><style>text{font-family:system-ui,-apple-system,'Segoe UI','Noto Sans CJK JP',sans-serif;fill:#243248}.small{font-size:14px;fill:#53627a}.label{font-size:17px;font-weight:700}.tag{font-size:12px;font-weight:700;fill:#4f46e5}.mono{font-family:ui-monospace,Consolas,monospace}</style><rect width="760" height="350" rx="14" fill="#f8fafc"/><rect x="230" y="22" width="300" height="68" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="380.0" y="48.5" text-anchor="middle" class="label">Notification 型</text><text x="380.0" y="78.5" text-anchor="middle" class="small">共通の Send(string) 呼び出し</text><path d="M380 90V118H190V155" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><path d="M380 118H570V155" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="161" width="315" height="91" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="187.5" y="199.0" text-anchor="middle" class="label">EmailNotification</text><text x="187.5" y="229.0" text-anchor="middle" class="small">override → メールを出力</text><rect x="415" y="161" width="315" height="91" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="572.5" y="199.0" text-anchor="middle" class="label">ScreenNotification</text><text x="572.5" y="229.0" text-anchor="middle" class="small">override → 画面へ出力</text><text x="380" y="310" text-anchor="middle" class="small">実体の型に応じたoverrideが呼ばれる。</text></svg>
