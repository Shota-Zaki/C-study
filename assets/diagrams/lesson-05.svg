<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc"><title id="title">送料の分岐</title><desc id="desc">5000円以上を最初に判定するので、その条件に一致する場合は会員かどうかにかかわらず送料無料です。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c6b82"/></marker></defs><style>text{font-family:system-ui,-apple-system,'Segoe UI','Noto Sans CJK JP',sans-serif;fill:#243248}.small{font-size:14px;fill:#53627a}.label{font-size:17px;font-weight:700}.tag{font-size:12px;font-weight:700;fill:#4f46e5}.mono{font-family:ui-monospace,Consolas,monospace}</style><rect width="760" height="390" rx="14" fill="#f8fafc"/><rect x="30" y="25" width="220" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="140.0" y="48.5" text-anchor="middle" class="label">小計 4200円</text><text x="140.0" y="78.5" text-anchor="middle" class="small">会員 = true</text><path d="M140 87V113" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><path d="M140.0 115L250 162.5L140.0 210L30 162.5Z" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="140.0" y="160.5" text-anchor="middle" class="label">5000円以上?</text><text x="140.0" y="185.5" text-anchor="middle" class="small">4200 &gt;= 5000</text><path d="M250 162H460" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><text x="350" y="149" text-anchor="middle" class="tag">true</text><rect x="465" y="129" width="240" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="585.0" y="154.5" text-anchor="middle" class="label">送料 0円</text><text x="585.0" y="184.5" text-anchor="middle" class="small">5000円以上の注文</text><path d="M140 210V237" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><text x="171" y="230" text-anchor="middle" class="tag">false</text><path d="M140.0 238L250 285.0L140.0 332L30 285.0Z" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="140.0" y="283.0" text-anchor="middle" class="label">会員か?</text><text x="140.0" y="308.0" text-anchor="middle" class="small">true</text><path d="M250 285H460" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><text x="350" y="271" text-anchor="middle" class="tag">true</text><rect x="465" y="252" width="240" height="66" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="585.0" y="277.5" text-anchor="middle" class="label">送料 300円</text><text x="585.0" y="307.5" text-anchor="middle" class="small">今回選ばれる結果</text><path d="M140 332V362H460" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><text x="305" y="350" text-anchor="middle" class="tag">false</text><rect x="465" y="338" width="240" height="39" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="585.0" y="364.0" text-anchor="middle" class="label">非会員：送料600円</text></svg>
