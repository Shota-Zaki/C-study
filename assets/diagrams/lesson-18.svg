<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title desc"><title id="title">絞り込みから表示用データまで</title><desc id="desc">この例では条件に一致する2商品だけを取り出します。パイプラインの各段階で、要素数と要素の型を区別します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c6b82"/></marker></defs><style>text{font-family:system-ui,-apple-system,'Segoe UI','Noto Sans CJK JP',sans-serif;fill:#243248}.small{font-size:14px;fill:#53627a}.label{font-size:17px;font-weight:700}.tag{font-size:12px;font-weight:700;fill:#4f46e5}.mono{font-family:ui-monospace,Consolas,monospace}</style><rect width="760" height="350" rx="14" fill="#f8fafc"/><text x="380" y="30" text-anchor="middle" class="label">価格が200円以上の商品を抽出し、表示用に変換</text><rect x="28" y="50" width="186" height="69" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="121.0" y="77.0" text-anchor="middle" class="label">ノート</text><text x="121.0" y="107.0" text-anchor="middle" class="small">200円</text><rect x="28" y="140" width="186" height="69" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="121.0" y="167.0" text-anchor="middle" class="label">ペン</text><text x="121.0" y="197.0" text-anchor="middle" class="small">120円</text><rect x="28" y="230" width="186" height="69" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="121.0" y="257.0" text-anchor="middle" class="label">ファイル</text><text x="121.0" y="287.0" text-anchor="middle" class="small">500円</text><rect x="271" y="105" width="198" height="98" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="370.0" y="146.5" text-anchor="middle" class="label">Where</text><text x="370.0" y="176.5" text-anchor="middle" class="small">price &gt;= 200</text><path d="M214 84H242V131H266" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><path d="M214 264H242V174H266" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><path d="M214 174H245" fill="none" stroke="#5c6b82" stroke-width="2" stroke-dasharray="6 5"/><text x="248" y="204" text-anchor="middle" class="small">除外</text><path d="M469 154H510" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><rect x="515" y="58" width="220" height="75" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="625.0" y="88.0" text-anchor="middle" class="label">Select</text><text x="625.0" y="118.0" text-anchor="middle" class="small">名前と価格を文字列へ</text><path d="M625 133V179" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><rect x="515" y="185" width="220" height="111" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="625.0" y="222.5" text-anchor="middle" class="label">ToArray</text><text x="625.0" y="252.5" text-anchor="middle" class="small">ノート: 200円 / ファイル: </text><text x="625.0" y="273.5" text-anchor="middle" class="small">500円</text></svg>
