<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title desc"><title id="title">整数除算と小数除算</title><desc id="desc">式の計算が先、代入先への変換が後です。小数部分が必要なら、除算する前に少なくとも一方を小数型にします。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c6b82"/></marker></defs><style>text{font-family:system-ui,-apple-system,'Segoe UI','Noto Sans CJK JP',sans-serif;fill:#243248}.small{font-size:14px;fill:#53627a}.label{font-size:17px;font-weight:700}.tag{font-size:12px;font-weight:700;fill:#4f46e5}.mono{font-family:ui-monospace,Consolas,monospace}</style><rect width="760" height="350" rx="14" fill="#f8fafc"/><text x="190" y="35" text-anchor="middle" class="label">整数同士の除算</text><text x="570" y="35" text-anchor="middle" class="label">除算より前に型変換</text><rect x="38" y="60" width="302" height="83" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="189.0" y="94.0" text-anchor="middle" class="label">7 / 2</text><text x="189.0" y="124.0" text-anchor="middle" class="small">int / int</text><rect x="418" y="60" width="302" height="83" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="569.0" y="94.0" text-anchor="middle" class="label">(double)7 / 2</text><text x="569.0" y="124.0" text-anchor="middle" class="small">double / int</text><path d="M190 143V187" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><path d="M570 143V187" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><rect x="38" y="193" width="302" height="87" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="189.0" y="229.0" text-anchor="middle" class="label">結果 3</text><text x="189.0" y="259.0" text-anchor="middle" class="small">代入先をdoubleにしても3のまま</text><rect x="418" y="193" width="302" height="87" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="569.0" y="229.0" text-anchor="middle" class="label">結果 3.5</text><text x="569.0" y="259.0" text-anchor="middle" class="small">小数部分を含む結果</text><text x="380" y="324" text-anchor="middle" class="small">演算に使う型によって、除算の結果が変わる</text></svg>
