<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title desc"><title id="title">型名が解決される範囲</title><desc id="desc">System.Console.WriteLine(&quot;Hello&quot;)の各部分を分けた図です。using System;があるとSystem.を省略できます。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c6b82"/></marker></defs><style>text{font-family:system-ui,-apple-system,'Segoe UI','Noto Sans CJK JP',sans-serif;fill:#243248}.small{font-size:14px;fill:#53627a}.label{font-size:17px;font-weight:700}.tag{font-size:12px;font-weight:700;fill:#4f46e5}.mono{font-family:ui-monospace,Consolas,monospace}</style><rect width="760" height="350" rx="14" fill="#f8fafc"/><rect x="26" y="20" width="705" height="305" rx="10" fill="#edf2ff" stroke="#cbd5e1"/><text x="48" y="48" text-anchor="start" class="label">System</text><text x="235" y="48" text-anchor="start" class="small">名前空間</text><rect x="86" y="93" width="615" height="232" rx="10" fill="#f3f6ff" stroke="#cbd5e1"/><text x="108" y="121" text-anchor="start" class="label">Console</text><text x="295" y="121" text-anchor="start" class="small">名前空間内の型</text><rect x="146" y="166" width="525" height="159" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="168" y="194" text-anchor="start" class="label">WriteLine</text><text x="355" y="194" text-anchor="start" class="small">型が持つメソッド</text><rect x="206" y="239" width="435" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="228" y="267" text-anchor="start" class="label">(&quot;Hello&quot;)</text><text x="415" y="267" text-anchor="start" class="small">呼び出し時の引数</text></svg>
