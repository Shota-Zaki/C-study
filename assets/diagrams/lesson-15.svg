<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title desc"><title id="title">データの形とコレクション</title><desc id="desc">同じデータでも用途によって適した形が違います。DictionaryのキーとHashSetの要素は重複の扱いが重要です。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c6b82"/></marker></defs><style>text{font-family:system-ui,-apple-system,'Segoe UI','Noto Sans CJK JP',sans-serif;fill:#243248}.small{font-size:14px;fill:#53627a}.label{font-size:17px;font-weight:700}.tag{font-size:12px;font-weight:700;fill:#4f46e5}.mono{font-family:ui-monospace,Consolas,monospace}</style><rect width="760" height="350" rx="14" fill="#f8fafc"/><rect x="32" y="36" width="316" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="190.0" y="84.5" text-anchor="middle" class="label">List&lt;string&gt;</text><text x="190.0" y="114.5" text-anchor="middle" class="small">[ノート, ペン, ノート]</text><rect x="412" y="36" width="316" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="570.0" y="84.5" text-anchor="middle" class="label">Dictionary</text><text x="570.0" y="114.5" text-anchor="middle" class="small">P01 → 200円</text><rect x="32" y="183" width="316" height="112" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="190.0" y="231.5" text-anchor="middle" class="label">HashSet&lt;string&gt;</text><text x="190.0" y="261.5" text-anchor="middle" class="small">{ノート, ペン}</text><rect x="412" y="183" width="316" height="112" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="570.0" y="231.5" text-anchor="middle" class="label">型引数&lt;T&gt;</text><text x="570.0" y="261.5" text-anchor="middle" class="small">要素やキーの型を固定</text></svg>
