<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title desc"><title id="title">クエリ定義と列挙の時点</title><desc id="desc">LINQ to ObjectsのWhereは遅延実行です。ToListなどで列挙した結果を保持すると、その後の追加は結果のListへ自動反映されません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c6b82"/></marker></defs><style>text{font-family:system-ui,-apple-system,'Segoe UI','Noto Sans CJK JP',sans-serif;fill:#243248}.small{font-size:14px;fill:#53627a}.label{font-size:17px;font-weight:700}.tag{font-size:12px;font-weight:700;fill:#4f46e5}.mono{font-family:ui-monospace,Consolas,monospace}</style><rect width="760" height="350" rx="14" fill="#f8fafc"/><rect x="30" y="27" width="300" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="180.0" y="64.5" text-anchor="middle" class="label">query = source.Where(...)</text><text x="180.0" y="94.5" text-anchor="middle" class="small">条件だけを定義</text><rect x="423" y="27" width="307" height="90" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="576.5" y="64.5" text-anchor="middle" class="label">snapshot = query.ToList()</text><text x="576.5" y="94.5" text-anchor="middle" class="small">この時点の結果 [2]</text><path d="M330 72H418" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 117V190" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="195" width="300" height="95" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="180.0" y="235.0" text-anchor="middle" class="label">source.Add(4)</text><text x="180.0" y="265.0" text-anchor="middle" class="small">元データに4を追加</text><path d="M330 242H418" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><rect x="423" y="195" width="307" height="95" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="576.5" y="235.0" text-anchor="middle" class="label">query を列挙</text><text x="576.5" y="265.0" text-anchor="middle" class="small">変更後の元データ → [2, 4]</text><text x="380" y="328" text-anchor="middle" class="small">snapshot の要素は [2] のまま。query は列挙する時点で評価。</text></svg>
