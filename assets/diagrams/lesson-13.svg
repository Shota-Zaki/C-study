<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc"><title id="title">値のコピーと参照のコピー</title><desc id="desc">これは代入の意味を表す概念図です。スタック・ヒープなど、物理的なメモリ配置を断定する図ではありません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c6b82"/></marker></defs><style>text{font-family:system-ui,-apple-system,'Segoe UI','Noto Sans CJK JP',sans-serif;fill:#243248}.small{font-size:14px;fill:#53627a}.label{font-size:17px;font-weight:700}.tag{font-size:12px;font-weight:700;fill:#4f46e5}.mono{font-family:ui-monospace,Consolas,monospace}</style><rect width="760" height="390" rx="14" fill="#f8fafc"/><text x="40" y="34" text-anchor="start" class="label">値型：代入した値は別々</text><rect x="40" y="58" width="220" height="78" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="150.0" y="89.5" text-anchor="middle" class="label">a = 3</text><text x="150.0" y="119.5" text-anchor="middle" class="small">変更後も 3</text><rect x="395" y="58" width="280" height="78" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="535.0" y="89.5" text-anchor="middle" class="label">b = a → b = 9</text><text x="535.0" y="119.5" text-anchor="middle" class="small">bの値だけが変わる</text><path d="M260 95H390" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><text x="325" y="82" text-anchor="middle" class="tag">値をコピー</text><text x="40" y="180" text-anchor="start" class="label">参照型：参照をコピーすると同じ実体を指す</text><rect x="40" y="207" width="200" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="140.0" y="243.5" text-anchor="middle" class="label">first</text><rect x="40" y="297" width="200" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="140.0" y="333.5" text-anchor="middle" class="label">second</text><rect x="405" y="235" width="290" height="95" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="550.0" y="275.0" text-anchor="middle" class="label">List オブジェクトA</text><text x="550.0" y="305.0" text-anchor="middle" class="small">[ノート, ペン]</text><path d="M240 237H315V265H400" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><path d="M240 327H315V302H400" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><text x="448" y="366" text-anchor="middle" class="small">second.Addでfirstから見える要素も増える</text></svg>
