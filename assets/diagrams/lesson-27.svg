<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title desc"><title id="title">入力から結果までの責務</title><desc id="desc">責務を分けることは、必ず大量のクラスを増やすことではありません。小さなアプリではメソッド分割から始められます。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c6b82"/></marker></defs><style>text{font-family:system-ui,-apple-system,'Segoe UI','Noto Sans CJK JP',sans-serif;fill:#243248}.small{font-size:14px;fill:#53627a}.label{font-size:17px;font-weight:700}.tag{font-size:12px;font-weight:700;fill:#4f46e5}.mono{font-family:ui-monospace,Consolas,monospace}</style><rect width="760" height="350" rx="14" fill="#f8fafc"/><rect x="28" y="37" width="315" height="102" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="185.5" y="80.5" text-anchor="middle" class="label">入力を受け取る</text><text x="185.5" y="110.5" text-anchor="middle" class="small">文字列 &quot; 3 &quot;</text><rect x="417" y="37" width="315" height="102" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="574.5" y="80.5" text-anchor="middle" class="label">変換・検証</text><text x="574.5" y="110.5" text-anchor="middle" class="small">整数か / 1以上か</text><rect x="28" y="211" width="315" height="102" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="185.5" y="254.5" text-anchor="middle" class="label">表示</text><text x="185.5" y="284.5" text-anchor="middle" class="small">結果またはエラー</text><rect x="417" y="211" width="315" height="102" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="574.5" y="254.5" text-anchor="middle" class="label">計算</text><text x="574.5" y="284.5" text-anchor="middle" class="small">単価 × 数量</text><path d="M343 88H411" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><path d="M575 139V205" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><path d="M417 262H350" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><text x="47" y="59" text-anchor="middle" class="tag">1</text><text x="436" y="59" text-anchor="middle" class="tag">2</text><text x="436" y="233" text-anchor="middle" class="tag">3</text><text x="47" y="233" text-anchor="middle" class="tag">4</text></svg>
