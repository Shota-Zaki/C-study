<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc"><title id="title">独立した処理を開始して合流する</title><desc id="desc">結果配列の順番はTaskを渡した順番です。完了した順番ではありません。処理の独立性を確認してから同時に開始します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c6b82"/></marker></defs><style>text{font-family:system-ui,-apple-system,'Segoe UI','Noto Sans CJK JP',sans-serif;fill:#243248}.small{font-size:14px;fill:#53627a}.label{font-size:17px;font-weight:700}.tag{font-size:12px;font-weight:700;fill:#4f46e5}.mono{font-family:ui-monospace,Consolas,monospace}</style><rect width="760" height="390" rx="14" fill="#f8fafc"/><text x="30" y="33" text-anchor="start" class="small">時間の流れ →</text><path d="M200 29H708" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><text x="35" y="100" text-anchor="start" class="label">Task A</text><text x="35" y="190" text-anchor="start" class="label">Task B</text><rect x="190" y="65" width="340" height="65" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="360.0" y="90.0" text-anchor="middle" class="label">10を返す処理</text><text x="360.0" y="120.0" text-anchor="middle" class="small">完了まで待機</text><rect x="190" y="155" width="205" height="65" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="292.5" y="180.0" text-anchor="middle" class="label">20を返す処理</text><text x="292.5" y="210.0" text-anchor="middle" class="small">先に完了</text><path d="M530 97H595V270" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><path d="M395 187H565V270" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><rect x="365" y="277" width="340" height="65" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="535.0" y="302.0" text-anchor="middle" class="label">await Task.WhenAll(a, b)</text><text x="535.0" y="332.0" text-anchor="middle" class="small">結果は [10, 20]</text><text x="380" y="373" text-anchor="middle" class="small">完了した順番ではなく、WhenAllに渡したTaskの順番</text></svg>
