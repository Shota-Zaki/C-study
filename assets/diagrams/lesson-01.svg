<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title desc"><title id="title">ソースから画面表示まで</title><desc id="desc">通常のマネージ実行の概念図です。ソースの保存→ビルド→実行の順に進みます。Native AOTなど、別の実行方式もあります。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5c6b82"/></marker></defs><style>text{font-family:system-ui,-apple-system,'Segoe UI','Noto Sans CJK JP',sans-serif;fill:#243248}.small{font-size:14px;fill:#53627a}.label{font-size:17px;font-weight:700}.tag{font-size:12px;font-weight:700;fill:#4f46e5}.mono{font-family:ui-monospace,Consolas,monospace}</style><rect width="760" height="350" rx="14" fill="#f8fafc"/><rect x="28" y="37" width="315" height="102" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="185.5" y="80.5" text-anchor="middle" class="label">Program.cs</text><text x="185.5" y="110.5" text-anchor="middle" class="small">C#で記述した処理</text><rect x="417" y="37" width="315" height="102" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="574.5" y="80.5" text-anchor="middle" class="label">コンパイラー</text><text x="574.5" y="110.5" text-anchor="middle" class="small">構文と型を検査</text><rect x="28" y="211" width="315" height="102" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/><text x="185.5" y="254.5" text-anchor="middle" class="label">.NET Runtime</text><text x="185.5" y="284.5" text-anchor="middle" class="small">処理を実行</text><rect x="417" y="211" width="315" height="102" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="574.5" y="254.5" text-anchor="middle" class="label">アセンブリ</text><text x="574.5" y="284.5" text-anchor="middle" class="small">ILと型の情報</text><path d="M343 88H411" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><path d="M575 139V205" fill="none" stroke="#5c6b82" stroke-width="2" marker-end="url(#arrow)"/><path d="M417 262H350" fill="none" stroke