name: Environment check
on:
  push:
    branches: [work]
    paths: [.github/workflows/environment-check.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Available verification tools
        run: |
          python3 --version
          node --version
          dotnet --list-sdks
